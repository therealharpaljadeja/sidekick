name: Bug report
description: Something in Sidekick doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sidekick version
      description: Sidekick → About Sidekick, or the DMG name.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Pro 14" M3
    validations:
      required: true
  - type: input
    id: recorder
    attributes:
      label: Recording app (if it's about hiding from recordings)
      placeholder: QuickTime, OBS, Screen Studio, Zoom…
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
