name: Feature request
description: Suggest an idea for Sidekick
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or moment while recording where Sidekick gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
